project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - methodology.qmd
    - long-term-model.qmd
  resources:
    - lt_app/
    - snapshots/lt/

website:
  title: "Luke Chambers - Sports Data Portfolio"
  site-url: https://lukechambers999.github.io/portfolio_2026/
  repo-url: https://github.com/lukechambers999/portfolio_2026
  navbar:
    left:
      - href: index.qmd
        text: Game State Corner Model
      - href: long-term-model.qmd
        text: Season Outrights Model
      - href: methodology.qmd
        text: Methodology
    right:
      - icon: github
        href: https://github.com/lukechambers999/portfolio_2026
        aria-label: Code on GitHub

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-location: right
    toc-depth: 3
    number-sections: false
    smooth-scroll: true
    embed-resources: false
    fig-responsive: true
    html-math-method: katex

execute:
  echo: false
  warning: false
  message: false
  freeze: auto
